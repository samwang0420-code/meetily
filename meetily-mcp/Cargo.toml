[package]
name = "meetily-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "MCP server for 言镜 AI — exposes meeting notes / summaries / action items to AI assistants (Claude / Cursor)"
license = "MIT"

[[bin]]
name = "meetily-mcp"
path = "src/main.rs"

[dependencies]
# Use rusqlite for direct read-only DB access (simpler than sqlx for stdio tool)
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
anyhow = { workspace = true }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
