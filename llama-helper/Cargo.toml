[package]
name = "llama-helper"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
llama-cpp-2 = "=0.1.154"  # §196 upgrade 0.1.146→0.1.154 (2026-08-29 ggml Q4_K ARM/Metal GEMV 优化)
